{% extends "dashboard/base.html" %}
{% block title %}Injection Room{% endblock %}
{% block page_title %}Injection Room{% endblock %}
{% block content %}
<div class="row g-3 mb-4">
    <div class="col-sm-6 col-xl-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <a href="{% url 'injection:queue' %}" class="btn btn-primary">Injection queue</a>
<a href="{% url 'injection:surgery_queue' %}" class="btn btn-outline-primary">Minor surgery queue</a>
                    </div>
                    <div class="rounded-3 bg-primary bg-opacity-10 text-primary p-2">
                        <i class="bi bi-syringe fs-4"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="card border-0 shadow-sm">
    <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-3 py-4">
        <div>
            <h5 class="fw-semibold mb-1">Injection worklist</h5>
            <p class="text-muted mb-0 small">Patients cleared for parenteral treatment.</p>
        </div>
        <a href="{% url 'injection:queue' %}" class="btn btn-primary px-4">
            <i class="bi bi-list-task me-2"></i>Worklist
        </a>
    </div>
</div>
{% endblock %}
