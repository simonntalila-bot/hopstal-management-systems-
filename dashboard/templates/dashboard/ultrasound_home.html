{% extends "dashboard/base.html" %}

{% block title %}Ultrasound{% endblock %}
{% block page_title %}Ultrasound{% endblock %}

{% block content %}
<div class="row g-3 mb-4">
    <div class="col-sm-6 col-xl-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="text-muted text-uppercase small fw-semibold" style="letter-spacing:.04em;">Queue</div>
                        <div class="display-6 fw-bold mt-1 mb-0">{{ waiting }}</div>
                        <div class="text-muted small mt-1">Awaiting scan</div>
                    </div>
                    <div class="rounded-3 bg-primary bg-opacity-10 text-primary p-2">
                        <i class="bi bi-soundwave fs-4"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-3 py-4">
        <div>
            <h5 class="fw-semibold mb-1">Ultrasound worklist</h5>
            <p class="text-muted mb-0 small">Patients cleared for imaging.</p>
        </div>
        <a href="{% url 'ultrasound:queue' %}" class="btn btn-primary px-4">
            <i class="bi bi-list-task me-2"></i>Worklist
        </a>
    </div>
</div>
{% endblock %}
