# ---------------------------------------------------------------------------
# nginx site configuration - Argentina Dispensary CDMS
# Domain : makongatiarg.co.tz / www.makongatiarg.co.tz
#
# Install:
#   sudo cp deploy/nginx/makongatiarg.co.tz.conf /etc/nginx/sites-available/cdms
#   sudo ln -s /etc/nginx/sites-available/cdms /etc/nginx/sites-enabled/cdms
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace these paths if the app is installed elsewhere:
#   APP_DIR   -> the directory containing manage.py
#   USER/GROUP -> the OS account that runs gunicorn
#
# Assumes: gunicorn on a unix socket at /run/cdms/gunicorn.sock
# ---------------------------------------------------------------------------

upstream cdms {
    server unix:/run/cdms/gunicorn.sock fail_timeout=0;
}

# Rate-limit zones: protects login and password-reset endpoints from brute force.
limit_req_zone $binary_remote_addr zone=cdms_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cdms_general:10m rate=60r/m;

# --- HTTP: ACME challenge + redirect everything else to HTTPS ---------------
server {
    listen 80;
    listen [::]:80;
    server_name makongatiarg.co.tz www.makongatiarg.co.tz;

    # Certbot renews over http, so this location must stay reachable.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name makongatiarg.co.tz www.makongatiarg.co.tz;

    # --- TLS (Let's Encrypt, issued by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/makongatiarg.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/makongatiarg.co.tz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Uploads: patient documents, ultrasound images, QR codes ---
    # Raise this if a 413 appears on large files. 50M matches Django's limit.
    client_max_body_size 50M;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    access_log /var/log/nginx/cdms.access.log;
    error_log  /var/log/nginx/cdms.error.log;

    # --- Static files: served by nginx, not Django ---
    location /static/ {
        alias /srv/cdms/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- Media files ---
    # Only needed when using a local persistent volume. If AWS_STORAGE_BUCKET_NAME
    # is set, Django returns S3/CDN URLs and this block is never hit.
    location /media/ {
        alias /srv/cdms/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "private";
        # Patient records must never be cached by a shared proxy.
        add_header Pragma "private";
        try_files $uri =404;
    }

    # --- Login / password reset: stricter rate limit ---
    location /accounts/login/ {
        limit_req zone=cdms_login burst=5 nodelay;
        proxy_pass http://cdms;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/accounts/password/ {
        limit_req zone=cdms_login burst=5 nodelay;
        proxy_pass http://cdms;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Everything else -> Gunicorn ---
    location / {
        limit_req zone=cdms_general burst=40 nodelay;
        proxy_pass http://cdms;
        proxy_http_version 1.1;

        # Required so Django sees the real scheme and host.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Long-running requests (reports, exports) should not be cut off.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
