<div class="card border-0 shadow-sm mb-3">
    <div class="card-header">Visit summary</div>
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label small">Next appointment</label>
                <input type="date" name="next_appointment" class="form-control"
                       value="{{ rch_visit.next_appointment|date:'Y-m-d' }}">
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <div class="form-check mb-2">
                    <input type="checkbox" name="is_high_risk" class="form-check-input" id="hr"
                           {% if rch_visit.is_high_risk %}checked{% endif %}>
                    <label class="form-check-label" for="hr">High-risk client</label>
                </div>
            </div>
            <div class="col-12">
                <label class="form-label small">Clinical notes</label>
                <textarea name="clinical_notes" class="form-control" rows="2">{{ rch_visit.clinical_notes }}</textarea>
            </div>
        </div>
    </div>
</div>

<div class="d-flex flex-wrap gap-2">
    <button type="submit" name="action" value="save" class="btn btn-outline-primary">Save</button>
    <button type="submit" name="action" value="return_doctor" class="btn btn-outline-secondary">
        Save & return to Doctor
    </button>
    <button type="submit" name="action" value="complete" class="btn btn-success"
            onclick="return confirm('Complete this RCH visit?')">
        Complete visit
    </button>
</div>
