# ---------------------------------------------------------------------------
# Render blueprint - DEMO / TEST ONLY
# ---------------------------------------------------------------------------
# This serves a public read-only-ish DEMO of the CDMS on Render's free plan.
#
#   GitHub  ->  Render  ->  Django CDMS demo  ->  https://<name>.onrender.com
#
# It is deliberately NOT the production deployment:
#
#   * The database is SQLite in a local file. Render's filesystem is
#     ephemeral, so the database is rebuilt by preDeployCommand on every
#     deploy and wiped on every restart. Demo data is invented and reseeded,
#     but anything typed in by hand will be lost.
#   * The free plan sleeps after 15 minutes of inactivity and takes ~1 minute
#     to wake, so the first request after a pause is slow.
#   * No patient data may ever be entered here.
#
# Production remains MySQL on a real host behind nginx. See
# docs/DEPLOYMENT.md for that path and docs/RENDER_DEPLOYMENT.md for the
# step-by-step Render walkthrough.
#
# Nothing in makongatiarg.co.tz is touched by this file. Render gets its own
# onrender.com hostname.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: cdms-demo
    runtime: python
    plan: free
    region: frankfurt

    # Explicit, though it is already the default. It stops the service being
    # created with a subdirectory as its root, which would hide manage.py and
    # make every command below fail with "No such file or directory".
    rootDir: .

    # Deploy the newest commit on main without anyone pressing the button, so
    # a fix pushed to GitHub is live.
    autoDeployTrigger: commit

    # Python is pinned in three places on purpose, because Render reads
    # different ones in different situations:
    #
    #   .python-version   read from the repository for EVERY Python service,
    #                     including one created by hand instead of a blueprint
    #   runtime.txt       same, the older Heroku-style spelling
    #   PYTHON_VERSION    below, applied when this file is the source of truth
    #
    # Without the first of these, Render falls back to its own default, which
    # is currently Python 3.14, and the build log says:
    #     Using Python version 3.14.3 (default)
    # That line means the pin was not picked up, not that the pin is wrong.
    # requirements.txt is left unpinned to <3.13, so a fallback is a silent
    # change of interpreter rather than a build that fails loudly.
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"

      # --- Secrets ---------------------------------------------------------
      # generateValue makes Render create a real random key per service.
      # Nothing secret is ever written into this file, and the placeholder
      # key in settings.py refuses to boot, so the demo cannot accidentally
      # run signed with a key published on GitHub.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # --- Core Django -----------------------------------------------------
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_DB_ENGINE
        value: sqlite

      # --- Hostname --------------------------------------------------------
      # sync: false asks you for this in the Render dashboard, because the
      # hostname does not exist until the service is created. Set it to the
      # EXACT host Render gives you, no scheme and no trailing slash:
      #     cdms-demo
      # A bare ".onrender.com" would also work but matches every Render
      # service, which is looser than this demo needs.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false

      # Same value as above but with https:// on the front. Django refuses a
      # CSRF origin that has no scheme, so this one must not be bare.
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false

      # Render terminates TLS and sets X-Forwarded-Proto, and
      # SECURE_PROXY_SSL_HEADER is already configured in settings.py, so the
      # secure cookies below are safe to turn on: the site is always HTTPS.
      # SECURE_SSL_REDIRECT and HSTS are deliberately left off because Render
      # already redirects to HTTPS and manages the certificate.
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "1"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "1"

      # --- Email -----------------------------------------------------------
      # Demo only. Password-reset emails print into the Render log instead of
      # being delivered. Do not put real mail credentials here.
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend

      # --- Logging ---------------------------------------------------------
      # Without this, Python buffers stdout and the Render log appears empty
      # until the buffer fills, which makes 500s very hard to debug.
      - key: PYTHONUNBUFFERED
        value: "1"

    # Build step only. It installs the dependencies and collects static files.
    # It must NOT run migrations or seed data: a build can be started and
    # abandoned, and a database that is half-migrated is harder to reason
    # about than one that is merely empty. Schema and demo data belong in
    # preDeployCommand below, which Render runs once, after a build succeeds.
    buildCommand: >-
      pip install --no-cache-dir -r requirements.txt
      && python manage.py collectstatic --no-input

    # Runs after the build succeeds, before the new version serves traffic.
    # migrate creates the schema in the fresh SQLite file and seed_demo fills
    # it. This is the step Render documents for migrations: "runs after the
    # service's buildCommand but before its startCommand".
    #
    # The field is preDeployCommand. There is no releaseCommand: Render's
    # blueprint schema sets additionalProperties false, so a releaseCommand
    # key makes Render reject the whole blueprint with "is not valid under
    # any of the given schemas" rather than ignoring the stray key. That is
    # checked by core/test_deployment.py.
    #
    # seed_demo is idempotent and refuses to touch MySQL unless
    # --force-in-production is passed, which is deliberately NOT passed here:
    # if the database is ever misconfigured to MySQL, this command fails loudly
    # instead of writing invented patient records into the real database.
    #
    # Note the hyphen: --no-input, not --noinput. Django does not accept the
    # shorter spelling, and it fails the step instead of waiting for a
    # prompt that will never come.
    preDeployCommand: >-
      python manage.py migrate --no-input
      && python manage.py seed_demo

    # The callable Render starts is hms_project.wsgi:application. WhiteNoise
    # serves everything in STATIC_ROOT, so no nginx is needed. --threads 4
    # keeps the free tier's 0.1 CPU busy while requests wait on SQLite.
    startCommand: >-
      gunicorn hms_project.wsgi:application
      --workers 2
      --threads 4
      --timeout 120
      --bind 0.0.0.0:$PORT
      --access-logfile -
      --error-logfile -

    healthCheckPath: /accounts/login/
