{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password | CDMS</title>
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/font/bootstrap-icons.css' %}">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: linear-gradient(145deg, #0d6efd 0%, #084298 45%, #0a2540 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .shell { width: 100%; max-width: 420px; }
        .brand { text-align: center; color: #fff; margin-bottom: 1.5rem; }
        .brand h1 { margin: 0; font-size: 1.5rem; font-weight: 700; }
        .card-box {
            background: #fff;
            border-radius: 18px;
            padding: 1.75rem 1.6rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }
        .form-control, .btn { border-radius: 10px; }
        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            font-weight: 600;
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            border: none;
        }
    </style>
</head>
<body>
<div class="shell">
    <div class="brand">
        <h1>CDMS</h1>
        <p class="mb-0 opacity-75">Argentina Dispensary</p>
    </div>
    <div class="card-box">
        <h2 class="h5 fw-semibold mb-1">Forgot password</h2>
        <p class="text-muted small mb-4">
            Enter the email on your staff account. We will send a reset link
            (check the server console in development).
        </p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold small">Email</label>
                <input type="email" name="email" class="form-control" required
                       placeholder="you@example.com" autocomplete="email">
            </div>
            <button type="submit" class="btn btn-primary">Send reset link</button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'login' %}" class="small text-decoration-none">Back to sign in</a>
        </div>
    </div>
</div>
</body>
</html>
